<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To my sweet boy 💗</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{
    background:#ffd6e7;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    overflow-x:hidden;
  }
  .container{text-align:center;width:100%;max-width:420px}
  .hint{font-size:15px;color:#d63384;margin-bottom:15px;font-weight:600}
  /* الظرف */
  .envelope{
    position:relative;
    width:320px;height:210px;
    background:#ffffff;
    border-radius:12px;
    margin:0 auto;
    box-shadow:0 15px 30px rgba(0,0,0,0.15);
    cursor:pointer;
    overflow:hidden;
  }
  .envelope:before{
    content:'';
    position:absolute;top:0;left:0;right:0;height:110px;
    background:#f8f8f8;
    clip-path:polygon(0 0,100% 0,50% 100%);
    border-bottom:2px solid #eee;
  }
  .heart-btn{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:75px;height:75px;
    background:#ff5da2;
    border:none;border-radius:50%;
    font-size:38px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 5px 15px rgba(255,93,162,0.5);
    animation:pulse 1.5s infinite;
    z-index:2;
  }
  @keyframes pulse{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}100%{transform:translate(-50%,-50%) scale(1)}}
  .click-text{margin-top:12px;color:#ff5da2;font-weight:700;font-size:15px}

  /* الرسالة */
  .letter{
    display:none;
    background:#fff;
    border-radius:20px;
    padding:28px 22px;
    box-shadow:0 15px 35px rgba(0,0,0,0.12);
    text-align:center;
    animation:pop .5s ease;
  }
  @keyframes pop{
